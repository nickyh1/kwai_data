kwai:
  base-url: https://openapi.kwaixiaodian.com
  app-key: "${KWAI_APP_KEY}"
  app-secret: "${KWAI_APP_SECRET}"
  sign-secret: "${KWAI_SIGN_SECRET}"
  shops:
    shop-biaowangchangjia:
      access-token: "${KWAI_TOKEN_BIAOWANGCHANGJIA}"
    shop-biaowanggongchang:
      access-token: "${KWAI_TOKEN_BIAOWANGGONGCHANG}"

  time:
    zone: Asia/Shanghai
    lookback-days: 7

spring:
  mongodb:
    uri: "${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ERP}"
    auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  datasource:
    # 本地开发默认配置；容器部署时通过环境变量 SPRING_DATASOURCE_* 覆盖
    url: jdbc:mysql://localhost:3306/ERP?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: kwai
    password: kwai123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # 已有库首次接入 Flyway 时自动 baseline，不影响现有表
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 Flyway 管理，Hibernate 不自动改表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC    # Instant 字段以 UTC 存入 DATETIME 列

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

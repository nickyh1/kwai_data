name: kwai-data
services:
  mongodb:
    image: mongo:7
    container_name: kwai-mongodb
    environment:
      MONGO_INITDB_DATABASE: ERP
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kwai-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/ERP
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:

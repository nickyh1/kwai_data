version: '3.8'

# ============================================================
# 快手数据同步服务 - Docker Compose
#
# 使用方式：
#   1. 将敏感配置放入 .env 文件（见下方注释）
#   2. docker compose up -d
#
# 敏感配置 .env 示例（放在项目根目录，已在 .gitignore 中忽略）：
#   MYSQL_ROOT_PASSWORD=your_root_password
#   MYSQL_PASSWORD=your_kwai_password
#   KWAI_APP_KEY=ks670191920826361315
#   KWAI_APP_SECRET=your_secret
#   KWAI_SIGN_SECRET=your_sign_secret
# ============================================================

services:

  # ── MySQL 8.0 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: kwai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ERP
      MYSQL_USER: kwai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kwai123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载建表脚本；首次启动自动执行
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-ukwai", "-p${MYSQL_PASSWORD:-kwai123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Spring Boot 应用 ──────────────────────────────────────
  app:
    build: .
    container_name: kwai-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接（覆盖 application.yml 中的默认值）
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/ERP?useUnicode=true
        &characterEncoding=utf8&serverTimezone=UTC
        &useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kwai
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-kwai123}

      # 快手 API 配置（通过 Spring 外部化配置覆盖 YAML）
      # 如果 token 较长不便写 env，可改用下方 volumes 挂载配置文件方案
      KWAI_APP_KEY:    ${KWAI_APP_KEY:-ks670191920826361315}
      KWAI_APP_SECRET: ${KWAI_APP_SECRET:-CO1TpCII8ydUJXd1DcppFA}
      KWAI_SIGN_SECRET: ${KWAI_SIGN_SECRET:-b0f7478aa6d1699838b2416618fa01b5}

      # 如需从外部挂载完整 application.yml（含 shop tokens），取消以下注释：
      # SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      # 可选：挂载外部配置目录，放置含 shop tokens 的 application.yml
      # - ./config:/app/config:ro
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local
